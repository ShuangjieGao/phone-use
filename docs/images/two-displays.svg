    <text x="30" y="55" font-size="35" font-weight="700" fill="#f2f7ec">Two displays on one tablet</text>
    <text x="770" y="51" text-anchor="end" font-size="18" fill="#adbfbe">Illustration</text>
    <path d="M30 78H770M471 103V372" fill="none" stroke="#456061" stroke-width="1.5"/>

    <text x="31" y="120" font-size="24" font-weight="700" fill="#f4c989">Your main display</text>
