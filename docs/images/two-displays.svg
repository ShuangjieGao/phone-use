<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="title desc">
  <title id="title">Two displays on one Android tablet</title>
  <desc id="desc">An illustration of a racing game on the tablet's physical display and a calculator on a separate Android virtual display controlled by the agent. A computer can optionally watch the virtual display.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#454873"/>
      <stop offset=".65" stop-color="#a36e82"/>
      <stop offset="1" stop-color="#edaa86"/>
    </linearGradient>
    <clipPath id="game"><rect x="44" y="154" width="390" height="183" rx="8"/></clipPath>
  </defs>
  <rect width="800" height="430" rx="18" fill="#142226"/>
