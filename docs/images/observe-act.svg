<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 296" width="800" height="296" role="img" aria-labelledby="title desc">
  <title id="title">Observe, tap, then read back the result</title>
  <desc id="desc">Illustrated calculator example. Read the DEG angle mode, tap the visible mode button on that observation, and observe again to verify that the calculator now shows RAD.</desc>
  <rect width="800" height="296" rx="18" fill="#f2f4eb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="27" y="46" font-size="30" font-weight="700" fill="#1f3834">Read back a change</text>
    <text x="773" y="42" text-anchor="end" font-size="17" fill="#4d645b">Calculator example · illustration</text>
    <g fill="#fffefa" stroke="#acbfb1" stroke-width="1.5">
      <rect x="26" y="70" width="224" height="199" rx="12"/>
      <rect x="288" y="70" width="224" height="199" rx="12"/>
      <rect x="550" y="70" width="224" height="199" rx="12"/>
    </g>
    <g fill="#23443d" font-size="22" font-weight="700">
      <text x="43" y="108">Observe</text>
      <text x="305" y="108">Tap the mode</text>
      <text x="567" y="108">Observe again</text>
    </g>
    <g fill="#e7efe4" stroke="#becfbe" stroke-width="1.2">
      <rect x="43" y="128" width="190" height="75" rx="8"/>
      <rect x="305" y="128" width="190" height="75" rx="8"/>
    </g>
    <rect x="567" y="128" width="190" height="75" rx="8" fill="#d8ede1" stroke="#9cbfad" stroke-width="1.2"/>
    <rect x="318" y="139" width="102" height="53" rx="9" fill="#fae5bc" stroke="#ae6a27" stroke-width="2"/>
    <g text-anchor="middle" fill="#27483f" font-weight="700" font-size="32">
      <text x="138" y="178">DEG</text>
      <text x="369" y="177">DEG</text>
      <text x="662" y="178">RAD</text>
    </g>
    <path d="m408 177 8 30 5-10 10 7 4-6-10-7 10-3z" fill="#23413e" stroke="#fffefa" stroke-linejoin="round" stroke-width="2"/>
    <g fill="none" stroke="#54796b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M257 166h19m-6-6 6 6-6 6"/>
      <path d="M519 166h19m-6-6 6 6-6 6"/>
    </g>
    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="18" fill="#43655b">
      <text x="43" y="243">phone_observe</text>
      <text x="305" y="243">phone_tap</text>
      <text x="567" y="243">phone_observe</text>
    </g>
  </g>
</svg>
